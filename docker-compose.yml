services:
  shorter-link-api:
    build: .
    container_name: shorter-link-api
    restart: unless-stopped
    networks:
      - internal-net
      - proxy-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M
    env_file:
      - .env
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy-net
      - traefik.http.routers.shorter-link.rule=(Host(`thuandd.io.vn`) || Host(`traefik`)) && PathPrefix(`/shorter-link-api`)
      - traefik.http.routers.shorter-link.entrypoints=web
      - traefik.http.services.shorter-link.loadbalancer.server.port=3001
      - traefik.http.routers.shorter-link.middlewares=shorter-link-strip
      - traefik.http.middlewares.shorter-link-strip.stripprefix.prefixes=/shorter-link-api

networks:
  proxy-net:
    external: true
  internal-net:
    external: true
